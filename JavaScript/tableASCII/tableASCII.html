<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Полная ASCII Таблица</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Полная ASCII Таблица (0–255)</h1>
  <input type="text" id="search" placeholder="Поиск по символу или коду...">

  <table>
    <thead>
      <tr>
        <th>Код</th><th>Символ</th>
        <th>Код</th><th>Символ</th>
        <th>Код</th><th>Символ</th>
        <th>Код</th><th>Символ</th>
      </tr>
    </thead>
    <tbody id="ascii-table"></tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
